[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-command-sender"
version = "1.5.0"
description = "Serial command GUI with C header command loading and ACK decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyserial==3.5",
    "ttkbootstrap==1.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pyinstaller>=6.13; sys_platform == 'win32'"]

[project.gui-scripts]
serial-command-sender = "serial_command_sender.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"serial_command_sender.data" = ["*_commands.h", "*.ico"]
